# CircleCI configuration to build GDevelop app running
# on the Electron runtime (newIDE/electron-app) for macOS and Linux.
# For Windows, see the appveyor.yml file.

# This also builds GDevelop.js and store it on a S3 so it can be used to run
# GDevelop without building it from scratch.

# Note that these CircleCI builds/tests are not launched on Pull Requests from forks,
# to avoid sharing secrets.

version: 2.1
parameters:
  # Run *every* visual monkey test, even on a branch. Set it when triggering a
  # pipeline (CircleCI UI or API) to check everything without waiting for the
  # change to land on `master`.
  run-all-visual-tests:
    type: boolean
    default: false
  # Number of parallel containers the visual monkey tests are split across.
  all-visual-tests-parallelism:
    type: integer
    default: 4
  # Same, for a branch (which only runs the tests related to its changes).
  changed-visual-tests-parallelism:
    type: integer
    default: 2
orbs:
  aws-cli: circleci/aws-cli@2.0.6
  macos: circleci/macos@2.5.1 # For Rosetta (see below)
  node: circleci/node@7.1.0 # For a recent npm version (see below)
  win: circleci/windows@5.1.0
commands:
  # Used by the visual monkey tests jobs on a "changed" scope: stop the job
  # (before anything expensive) when no test of the suite is related to what
  # the branch changes. A change to the tests themselves relates every test.
  halt-unless-a-visual-test-is-related-to-the-changes:
    parameters:
      scope:
        type: enum
        enum: ['all', 'changed']
      suite:
        type: enum
        enum: ['storybook', 'editor']
    steps:
      - run:
          name: Stop here if no test is related to the changes
          command: |
            if [ "<< parameters.scope >>" != "changed" ]; then exit 0; fi
            git fetch --depth=50 origin master
            cd newIDE/visual-tests
            PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund --silent
            if [ -z "$(node run.js --suite=<< parameters.suite >> --list-names --only-changed --base-ref=origin/master)" ]; then
              echo "No visual monkey test of the << parameters.suite >> suite is related to these changes."
              circleci-agent step halt
            fi
jobs:
  # Build the **entire** app for macOS (including the GDevelop.js library).
  build-macos:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    steps:
      - checkout
      # Install Rosetta for AWS CLI and disable TSO to speed up S3 uploads (https://support.circleci.com/hc/en-us/articles/19334402064027-Troubleshooting-slow-uploads-to-S3-for-jobs-using-an-m1-macOS-resource-class)
      - macos/install-rosetta
      # - run: sudo sysctl net.inet.tcp.tso=0

      # Install a recent version of npm to workaround a notarization issue because of a symlink made by npm: https://github.com/electron-userland/electron-builder/issues/7755
      # Node.js v20.14.0 comes with npm v10.7.0.
      - node/install:
          node-version: "20.14.0"

      # System dependencies (for Emscripten and upload)
      - run:
          name: Install dependencies for Emscripten
          command: brew install cmake

      - run:
          name: Install dependencies for AWS S3 upload
          command: curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg" && sudo installer -pkg AWSCLIV2.pkg -target /

      - run:
          name: Install Emscripten (for GDevelop.js)
          command: git clone https://github.com/juj/emsdk.git && cd emsdk && ./emsdk install 3.1.21 && ./emsdk activate 3.1.21 && cd ..

      # GDevelop.js dependencies
      - restore_cache:
          keys:
            - gd-macos-nodejs-dependencies-v2-{{ checksum "newIDE/app/package.json" }}-{{ checksum "newIDE/electron-app/package.json" }}-{{ checksum "GDevelop.js/package.json" }}-{{ checksum "GDJS/package-lock.json" }}
            # fallback to using the latest cache if no exact match is found
            - gd-macos-nodejs-dependencies-v2-

      - run:
          name: Install GDevelop.js dependencies
          command: cd GDevelop.js && npm install && cd ..

      # Build GDevelop.js (and run tests to ensure it works)
      - run:
          name: Build GDevelop.js
          command: cd GDevelop.js && source ../emsdk/emsdk_env.sh && npm run build && npm test && cd ..

      # GDevelop IDE dependencies (after building GDevelop.js to avoid downloading a pre-built version)
      - run:
          name: Install GDevelop IDE dependencies
          command: cd newIDE/app && npm install && cd ../electron-app && npm install

      - save_cache:
          paths:
            - newIDE/electron-app/node_modules
            - newIDE/app/node_modules
            - GDevelop.js/node_modules
            - GDJS/node_modules
          key: gd-macos-nodejs-dependencies-v2-{{ checksum "newIDE/app/package.json" }}-{{ checksum "newIDE/electron-app/package.json" }}-{{ checksum "GDevelop.js/package.json" }}-{{ checksum "GDJS/package-lock.json" }}

      # Build GDevelop IDE (seems like we need to allow Node.js to use more space than usual)
      # Note: Code signing is done using CSC_LINK (see https://www.electron.build/code-signing).
      # To test signing the code in the CI, add "export CSC_FOR_PULL_REQUEST=true && " before the command.
      - run:
          name: Build GDevelop IDE
          command: export CSC_FOR_PULL_REQUEST=true && export NODE_OPTIONS="--max-old-space-size=7168" && cd newIDE/electron-app && CI=false npm run build -- --mac --publish=never

      - run:
          name: Clean dist folder to keep only installers/binaries.
          command: rm -rf "newIDE/electron-app/dist/mac-universal/GDevelop 5.app"

      # Upload artifacts (CircleCI)
      - store_artifacts:
          path: newIDE/electron-app/dist

      # Upload artifacts (AWS)
      - run:
          name: Deploy to S3 (specific commit)
          command: |
            export PATH=~/.local/bin:$PATH
            for i in 1 2 3 4 5 6 7; do
              aws s3 sync newIDE/electron-app/dist s3://gdevelop-releases/$(git rev-parse --abbrev-ref HEAD)/commit/$(git rev-parse HEAD)/ && break
              echo "Retry $i failed... retrying in 10 seconds"
              sleep 10
            done
            if [ $i -eq 7 ]; then
              echo "All retries for deployment failed!" >&2
              exit 1
            fi

      - run:
          name: Deploy to S3 (latest)
          command: |
            export PATH=~/.local/bin:$PATH
            for i in 1 2 3 4 5 6 7; do
              aws s3 sync newIDE/electron-app/dist s3://gdevelop-releases/$(git rev-parse --abbrev-ref HEAD)/latest/ && break
              echo "Retry $i failed... retrying in 10 seconds"
              sleep 10
            done
            if [ $i -eq 7 ]; then
              echo "All retries for deployment failed!" >&2
              exit 1
            fi

  # Build the app for Linux (using a pre-built GDevelop.js library).
  build-linux:
    # CircleCI docker workers are failing if they don't have enough memory (no swap)
    resource_class: xlarge
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout
      - aws-cli/setup

      # System dependencies (for Electron Builder)
      - run:
          name: Update system dependencies
          command: sudo apt-get update

      - run:
          name: Install system dependencies for Electron builder
          command: sudo apt install icnsutils && sudo apt install graphicsmagick && sudo apt install rsync

      - restore_cache:
          keys:
            - gd-linux-nodejs-dependencies-v2-{{ checksum "newIDE/app/package.json" }}-{{ checksum "newIDE/electron-app/package.json" }}-{{ checksum "GDevelop.js/package.json" }}-{{ checksum "GDJS/package-lock.json" }}
            # fallback to using the latest cache if no exact match is found
            - gd-linux-nodejs-dependencies-v2-

      # GDevelop IDE dependencies (using an exact version of GDevelop.js, built previously)
      - run:
          name: Install GDevelop IDE dependencies
          command: export REQUIRES_EXACT_LIBGD_JS_VERSION=true && cd newIDE/app && npm install && cd ../electron-app && npm install

      - save_cache:
          paths:
            - newIDE/electron-app/node_modules
            - newIDE/app/node_modules
            - GDevelop.js/node_modules
            - GDJS/node_modules
          key: gd-linux-nodejs-dependencies-v2-{{ checksum "newIDE/app/package.json" }}-{{ checksum "newIDE/electron-app/package.json" }}-{{ checksum "GDevelop.js/package.json" }}-{{ checksum "GDJS/package-lock.json" }}

      # Build GDevelop IDE (seems like we need to allow Node.js to use more space than usual)
      - run:
          name: Build GDevelop IDE
          command: export NODE_OPTIONS="--max-old-space-size=7168" && cd newIDE/electron-app && npm run build -- --linux --publish=never

      - run:
          name: Clean dist folder to keep only installers/binaries.
          command: rm -rf newIDE/electron-app/dist/linux-unpacked && rm -rf newIDE/electron-app/dist/linux-arm64-unpacked

      # Upload artifacts (CircleCI)
      - store_artifacts:
          path: newIDE/electron-app/dist

      # Stage just the x64 portable zip for the downstream
      # cli-html5-export-linux job (avoid sharing the much larger
      # .AppImage/.deb installers via the workspace).
      - run:
          name: Stage portable zip for downstream cli-html5-export-linux job
          command: |
            mkdir -p build-linux-workspace
            for f in newIDE/electron-app/dist/gdevelop-*.zip; do
              case "$f" in
                *arm64*) ;;
                *) cp "$f" build-linux-workspace/ ;;
              esac
            done
            ls -lh build-linux-workspace
      - persist_to_workspace:
          root: build-linux-workspace
          paths:
            - .

      # Upload artifacts (AWS)
      - run:
          name: Deploy to S3 (specific commit)
          command: aws s3 sync newIDE/electron-app/dist s3://gdevelop-releases/$(git rev-parse --abbrev-ref HEAD)/commit/$(git rev-parse HEAD)/
      - run:
          name: Deploy to S3 (latest)
          command: aws s3 sync newIDE/electron-app/dist s3://gdevelop-releases/$(git rev-parse --abbrev-ref HEAD)/latest/

  # Build the WebAssembly library only (so that it's cached on a S3 and easy to re-use).
  build-gdevelop_js-wasm-only:
    resource_class: medium+ # Compilation time decrease linearly with the number of CPUs, but not linking (so "large" does not speedup total build time).
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout
      - aws-cli/setup

      # System dependencies (for Emscripten)
      - run:
          name: Install dependencies for Emscripten
          command: sudo apt-get update && sudo apt install cmake ccache

      - run:
          name: Install Emscripten (for GDevelop.js)
          command: git clone https://github.com/juj/emsdk.git && cd emsdk && ./emsdk install 3.1.21 && ./emsdk activate 3.1.21 && cd ..

      # GDevelop.js dependencies
      - restore_cache:
          keys:
            - gdevelop.js-linux-nodejs-dependencies-v2-{{ checksum "GDevelop.js/package-lock.json" }}
            # fallback to using the latest cache if no exact match is found
            - gdevelop.js-linux-nodejs-dependencies-v2-

      - run:
          name: Install GDevelop.js dependencies and build it
          command: cd GDevelop.js && npm install && cd ..

      # Cache emcc/em++ output via ccache (keyed by content hash, immune to
      # git checkout resetting source mtimes).
      - restore_cache:
          name: Restore ccache (Emscripten)
          keys:
            - gdevelop.js-emscripten-ccache-v1-{{ .Branch }}-{{ .Revision }}
            - gdevelop.js-emscripten-ccache-v1-{{ .Branch }}-
            - gdevelop.js-emscripten-ccache-v1-

      # Build GDevelop.js
      - run:
          name: Build GDevelop.js
          # CMAKE_(C|CXX)_COMPILER_LAUNCHER are read by CMake (>=3.17) from the
          # environment and prepended to every compiler invocation.
          command: |
            export CMAKE_C_COMPILER_LAUNCHER=ccache
            export CMAKE_CXX_COMPILER_LAUNCHER=ccache
            cd GDevelop.js && source ../emsdk/emsdk_env.sh && npm run build && cd ..
            ccache --show-stats

      - save_cache:
          name: Save ccache (Emscripten)
          key: gdevelop.js-emscripten-ccache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.cache/ccache

      # "--runInBand" is faster and avoids deadlocks on CircleCI Linux machines
      # (probably because of limited process numbers).
      - run:
          name: Run GDevelop.js tests
          command: cd GDevelop.js && source ../emsdk/emsdk_env.sh && npm test -- --runInBand && cd ..

      - save_cache:
          paths:
            - GDevelop.js/node_modules
          key: gdevelop.js-linux-nodejs-dependencies-v2-{{ checksum "GDevelop.js/package-lock.json" }}

      # Upload artifacts (CircleCI)
      - store_artifacts:
          path: Binaries/embuild/GDevelop.js

      # Upload artifacts (AWS)
      - run:
          name: Deploy to S3 (specific commit)
          command: aws s3 sync Binaries/embuild/GDevelop.js s3://gdevelop-gdevelop.js/$(git rev-parse --abbrev-ref HEAD)/commit/$(git rev-parse HEAD)/
      - run:
          name: Deploy to S3 (latest)
          command: aws s3 sync Binaries/embuild/GDevelop.js s3://gdevelop-gdevelop.js/$(git rev-parse --abbrev-ref HEAD)/latest/

  # Build the WebAssembly library with clang-tidy and memory sanitizers.
  build-gdevelop_js-debug-sanitizers-and-extra-checks:
    resource_class: xlarge # Total time decrease linearly with the number of CPUs.
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout
      - aws-cli/setup

      # System dependencies (for Emscripten)
      - run:
          name: Install dependencies for Emscripten
          command: sudo apt-get update && sudo apt install cmake

      - run:
          name: Install dependencies for clang-tidy v19
          command: wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 19 && sudo apt install clang-tidy-19

      - run:
          name: Install Emscripten (for GDevelop.js)
          command: git clone https://github.com/juj/emsdk.git && cd emsdk && ./emsdk install 3.1.21 && ./emsdk activate 3.1.21 && cd ..

      # GDevelop.js dependencies
      - restore_cache:
          keys:
            - gdevelop.js-linux-nodejs-dependencies-v2-{{ checksum "GDevelop.js/package-lock.json" }}
            # fallback to using the latest cache if no exact match is found
            - gdevelop.js-linux-nodejs-dependencies-v2-

      - run:
          name: Install GDevelop.js dependencies and build it
          command: cd GDevelop.js && npm install && cd ..

      # Build GDevelop.js
      - run:
          name: Build GDevelop.js ('debug-sanitizers' variant)
          command: cd GDevelop.js && source ../emsdk/emsdk_env.sh && npm run build -- --variant=debug-sanitizers

      - run:
          name: Run clang-tidy
          command: cd GDevelop.js && npm run lint

      - run:
          name: Run tests
          # Tests are slow under ASan and jest (in a non-TTY environment) only prints
          # output when a whole test file finishes, so allow long silences instead of
          # killing the step after the default 10 minutes without output.
          no_output_timeout: 30m
          # malloc_context_size: record fewer stack frames on each malloc/free (default
          # is 30) - a small, free speedup that only shortens traces in ASan reports.
          command: cd GDevelop.js && ASAN_OPTIONS=malloc_context_size=5 npm run test -- --maxWorkers=4

      # Upload artifacts (CircleCI)
      - store_artifacts:
          path: Binaries/embuild/GDevelop.js

      # Upload artifacts (AWS)
      - run:
          name: Deploy to S3 (specific commit)
          command: aws s3 sync Binaries/embuild/GDevelop.js s3://gdevelop-gdevelop.js/$(git rev-parse --abbrev-ref HEAD)/variant/debug-sanitizers/commit/$(git rev-parse HEAD)/

  # Build and run the native GDCore_tests with AddressSanitizer + UBSan, to
  # catch heap-use-after-free, buffer overflows and undefined behaviour that
  # only sometimes manifest as flaky segfaults. 
  # The Emscripten build has its own sanitizer job:
  # build-gdevelop_js-debug-sanitizers-and-extra-checks.
  build-gdcore-tests-sanitizers:
    resource_class: medium+
    docker:
      - image: cimg/base:current

    working_directory: ~/GDevelop

    steps:
      - checkout

      - run:
          name: Install build dependencies (cmake, clang, ccache, libstdc++ dev)
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake clang ccache libstdc++-12-dev

      # Cache the compiler output via ccache (keyed by content hash, so it is
      # immune to the fact that 'git checkout' resets every source file's mtime
      # to "now" on each run).
      - restore_cache:
          name: Restore ccache
          keys:
            - gdcore-tests-asan-ccache-v1-{{ .Branch }}-{{ .Revision }}
            - gdcore-tests-asan-ccache-v1-{{ .Branch }}-
            - gdcore-tests-asan-ccache-v1-

      - run:
          name: Configure GDCore_tests with ASan + UBSan (Debug)
          command: |
            mkdir -p .build-tests-asan
            cd .build-tests-asan
            cmake \
              -DBUILD_GDJS=FALSE \
              -DBUILD_EXTENSIONS=FALSE \
              -DBUILD_TESTS=TRUE \
              -DCMAKE_BUILD_TYPE=Debug \
              -DUSE_SANITIZERS="address,undefined" \
              -DCMAKE_CXX_COMPILER=$(which clang++) \
              -DCMAKE_C_COMPILER=$(which clang) \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              ..

      - run:
          name: Build GDCore_tests
          command: |
            cd .build-tests-asan && make -j 4 GDCore_tests
            ccache --show-stats

      - save_cache:
          name: Save ccache
          key: gdcore-tests-asan-ccache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.cache/ccache

      - run:
          name: Run GDCore_tests with sanitizers
          command: |
            cd .build-tests-asan
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:print_stacktrace=1
            export UBSAN_OPTIONS=print_stacktrace=1
            Core/GDCore_tests

  # Trigger AppVeyor build, which also does a Windows build (keep it for redundancy).
  trigger-appveyor-windows-build:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Trigger AppVeyor Windows build
          command: |
            curl -H "Content-Type: application/json" \
                 -H "Authorization: Bearer ${APPVEYOR_API_KEY}" \
                 --data "{
                   \"accountName\": \"4ian\",
                   \"projectSlug\": \"gdevelop\",
                   \"branch\": \"${CIRCLE_BRANCH}\"
                 }" \
                 -X POST https://ci.appveyor.com/api/builds

  build-windows:
    executor:
      name: win/default
      size: medium
    working_directory: /home/circleci/project
    steps:
      - checkout
      - run:
          # See https://www.ssl.com/how-to/how-to-integrate-esigner-cka-with-ci-cd-tools-for-automated-code-signing/
          #
          # This is necessary because of "signing to be FIPS-140 compliant". See
          # https://github.com/electron-userland/electron-builder/issues/6158
          #
          # Make sure to DISABLE "malware blocker" in SSL.com to avoid errors like:
          # Error information: "Error: SignerSign() failed." (-2146893821/0x80090003)
          name: Download and Unzip eSignerCKA Setup
          command: |

            Invoke-WebRequest -OutFile eSigner_CKA_1.0.3.zip "https://www.ssl.com/download/ssl-com-esigner-cka-1-0-3"

            Expand-Archive -Force eSigner_CKA_1.0.3.zip

            Remove-Item eSigner_CKA_1.0.3.zip

            Move-Item -Destination "eSigner_CKA_1.0.3.exe" -Path "eSigner_CKA_*\*.exe"
      - run:
          name: Setup eSignerCKA in Silent Mode
          command: |

            mkdir -p "/home/circleci/project/eSignerCKA"

            ./eSigner_CKA_1.0.3.exe /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR="/home/circleci/project/eSignerCKA" | Out-Null
      - run:
          name: Config Account Information on eSignerCKA
          command: |

            /home/circleci/project/eSignerCKA/eSignerCKATool.exe config -mode product -user "$env:ESIGNER_USER_NAME" -pass "$env:ESIGNER_USER_PASSWORD" -totp "$env:ESIGNER_USER_TOTP" -key "/home/circleci/project/eSignerCKA/master.key" -r
      - run:
          name: Load Certificate into Windows Store
          command: |

            /home/circleci/project/eSignerCKA/eSignerCKATool.exe unload

            /home/circleci/project/eSignerCKA/eSignerCKATool.exe load
      - run:
          name: Select Certificate From Windows Store and Sign Sample File with SignTool
          command: |

            $CodeSigningCert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1

            echo Certificate: $CodeSigningCert

      - restore_cache:
          name: Restore node_modules cache
          keys:
            - v2-win-node-{{ checksum "newIDE/app/package-lock.json" }}-{{ checksum "newIDE/electron-app/package-lock.json" }}-{{ checksum "GDJS/package-lock.json" }}
            - v2-win-node-

      - run:
          name: Install dependencies
          no_output_timeout: 25m
          # Remove package-lock.json because they seems to cause the npm install to be stuck. We should try again after re-generating them.
          # Also install setuptools as something requires distutils in electron-app, and it was removed in Python 3.12.
          # setuptools will make distutils available again (but we should migrate our packages probably).
          command: |
            pip install setuptools
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            cd newIDE\app

            npm -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Remove-Item package-lock.json

            $Env:REQUIRES_EXACT_LIBGD_JS_VERSION = "true"

            npm install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            cd ..\electron-app

            Remove-Item package-lock.json

            npm install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            cd ..\..

      - save_cache:
          name: Save node_modules cache
          key: v2-win-node-{{ checksum "newIDE/app/package-lock.json" }}-{{ checksum "newIDE/electron-app/package-lock.json" }}-{{ checksum "GDJS/package-lock.json" }}
          paths:
            - newIDE/app/node_modules
            - newIDE/electron-app/node_modules
            - GDJS/node_modules

      - run:
          name: Build NSIS executable (with code signing)
          command: |
            cd newIDE\electron-app

            $CodeSigningCert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1

            echo Certificate: $CodeSigningCert

            # Use a custom signtool path because of the signtool.exe bundled withy electron-builder not working for some reason.
            # Can also be found in versioned folders like "C:/Program Files (x86)/Windows Kits/10/bin/10.0.22000.0/x86/signtool.exe".
            # or "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x86\signtool.exe".

            $Env:SIGNTOOL_PATH = "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\signtool.exe"

            # Extract thumbprint and subject name of the certificate (will be passed to electron-builder).

            $Env:GD_SIGNTOOL_THUMBPRINT = $CodeSigningCert.Thumbprint

            $Env:GD_SIGNTOOL_SUBJECT_NAME = ($CodeSigningCert.Subject -replace ", ?", "`n" | ConvertFrom-StringData).CN

            # Build the nsis installer (signed: electron-builder will use SignTool.exe with the certificate)

            node scripts/build.js --win nsis --publish=never

            cd ..\..
      - run:
          name: Build AppX (without code signing)
          # Don't sign the appx (it will be signed by the Microsoft Store).
          command: |
            cd newIDE\electron-app

            # Build the appx (not signed). Ensure all variables used for code signing are empty.

            $Env:GD_SIGNTOOL_THUMBPRINT = ''

            $Env:GD_SIGNTOOL_SUBJECT_NAME = ''

            $Env:CSC_LINK = ''

            $Env:CSC_KEY_PASSWORD = ''

            node scripts/build.js --skip-app-build --win appx --publish=never

            cd ..\..
      - run:
          name: Build portable zip (without code signing)
          command: |
            cd newIDE\electron-app

            $Env:GD_SIGNTOOL_THUMBPRINT = ''

            $Env:GD_SIGNTOOL_SUBJECT_NAME = ''

            $Env:CSC_LINK = ''

            $Env:CSC_KEY_PASSWORD = ''

            $Env:GD_PORTABLE_BUILD = 'true'

            node scripts/build.js --skip-app-build --win zip --publish=never

            cd ..\..

      - run:
          name: Clean binaries
          shell: cmd.exe
          command: |
            rmdir /s /q newIDE\electron-app\dist\win-unpacked

      - run:
          name: Install AWS CLI
          command: |
            # Install the CLI for the current user

            pip install --quiet --upgrade --user awscli

            # Add the user-Scripts dir to PATH for this step and the next.

            $binDir = (python -m site --user-base) + "\Scripts"
            $Env:Path += ";$binDir"

            # Sanity check:
            aws --version

      # Upload artifacts (S3)
      - run:
          name: Deploy to S3 (specific commit)
          command: |
            aws s3 sync newIDE\electron-app\dist "s3://gdevelop-releases/$Env:CIRCLE_BRANCH/commit/$Env:CIRCLE_SHA1/"

      - run:
          name: Deploy to S3 (latest)
          command: |
            aws s3 sync newIDE\electron-app\dist "s3://gdevelop-releases/$Env:CIRCLE_BRANCH/latest/"

      # Upload artifacts (CircleCI)
      - store_artifacts:
          path: newIDE/electron-app/dist

  # End-to-end test that runs the GDevelop CLI to export an example game
  # to HTML5, using either the portable Linux build just produced by
  # build-linux (use-local-build=true) or the latest one downloaded from S3.
  run-cli-html5-export-linux:
    parameters:
      use-local-build:
        description: When true, attach the workspace produced by build-linux and use its portable zip instead of downloading the latest one from S3.
        type: boolean
        default: false
    resource_class: medium
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout

      - when:
          condition: << parameters.use-local-build >>
          steps:
            - attach_workspace:
                at: ~/GDevelop/build-linux-workspace

      # Runtime libraries required by Electron (headless still needs nss /
      # alsa to even start up).
      - run:
          name: Install Electron runtime dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libnss3 \
              libasound2t64 \
              libgbm1 \
              libgtk-3-0 \
              libxss1 \
              libatk-bridge2.0-0 \
              libdrm2 \
              libxkbcommon0 \
              xvfb

      # The script reuses the helpers from `newIDE/app/scripts` which
      # depend on axios, minimist, shelljs and adm-zip. Rather than running
      # a full `npm install` of `newIDE/app` (huge), we install just the
      # four packages we need into a scratch directory and expose it via
      # NODE_PATH so the script and its `./lib/*` helpers can `require` them.
      - run:
          name: Install minimal script deps (axios, minimist, shelljs, adm-zip)
          command: |
            mkdir -p cli-html5-export-deps
            cd cli-html5-export-deps
            npm init -y > /dev/null
            npm install --no-audit --no-fund --silent \
              axios@^0.18.1 \
              minimist@^1.2.5 \
              shelljs@^0.8.4 \
              adm-zip@^0.5.10

      - run:
          name: Run CLI HTML5 export
          # Wrap with xvfb-run as a safety net: even though the editor hides
          # its BrowserWindow in --run-command mode, Electron itself still
          # needs a usable display for some GPU/graphics initialization on
          # headless Linux runners.
          no_output_timeout: 20m
          command: |
            export NODE_PATH="$PWD/cli-html5-export-deps/node_modules"
            if [ "<< parameters.use-local-build >>" = "true" ]; then
              ZIP_PATH=$(ls ~/GDevelop/build-linux-workspace/gdevelop-*.zip | grep -v -- '-arm64' | head -1)
              if [ -z "$ZIP_PATH" ]; then
                echo "No portable zip found in build-linux workspace." >&2
                exit 1
              fi
              echo "Using locally built portable zip: $ZIP_PATH"
              EXTRA_ARGS="--zipPath=$ZIP_PATH"
            else
              echo "No local build available; will download the latest portable zip from S3."
              EXTRA_ARGS="--branch=master"
            fi
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
              node newIDE/app/scripts/test-portable-cli-export.js \
              $EXTRA_ARGS \
              --example=3d-platformer \
              --workDir=./cli-html5-export-work \
              --artifactsDir=./cli-html5-export-artifacts

      - store_artifacts:
          path: ./cli-html5-export-artifacts
          destination: cli-html5-export-artifacts

  # Visual monkey tests: manipulate an editor in a real browser and check that
  # nothing is broken (see newIDE/visual-tests/README.md).
  #
  # The "storybook" suite needs a built Storybook, which is built once here and
  # shared with the containers running the tests.
  build-storybook-for-visual-tests:
    parameters:
      scope:
        description: >
          "all" runs every test. "changed" only runs the tests related to what
          the branch changes - and nothing at all if it changes nothing related.
        type: enum
        enum: ['all', 'changed']
        default: 'all'
    resource_class: large
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout

      - halt-unless-a-visual-test-is-related-to-the-changes:
          scope: << parameters.scope >>
          suite: 'storybook'

      - restore_cache:
          keys:
            - gd-linux-nodejs-dependencies-v2-{{ checksum "newIDE/app/package.json" }}-{{ checksum "newIDE/electron-app/package.json" }}-{{ checksum "GDevelop.js/package.json" }}-{{ checksum "GDJS/package-lock.json" }}
            # fallback to using the latest cache if no exact match is found
            - gd-linux-nodejs-dependencies-v2-

      - run:
          name: Install GDevelop IDE dependencies
          command: cd newIDE/app && npm install

      - run:
          name: Build Storybook
          no_output_timeout: 20m
          command: export NODE_OPTIONS="--max-old-space-size=7168" && cd newIDE/app && npm run build-storybook

      - persist_to_workspace:
          root: newIDE/app
          paths:
            - build-storybook

  run-visual-monkey-tests-storybook-linux:
    parameters:
      scope:
        type: enum
        enum: ['all', 'changed']
        default: 'all'
      parallelism:
        description: Number of containers the tests are split across.
        type: integer
        default: 1
    parallelism: << parameters.parallelism >>
    resource_class: large
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout

      - halt-unless-a-visual-test-is-related-to-the-changes:
          scope: << parameters.scope >>
          suite: 'storybook'

      - attach_workspace:
          at: newIDE/app

      # The tests run in the Chrome that `npm install` downloads for Puppeteer
      # (see newIDE/visual-tests/package.json), which needs these libraries.
      - run:
          name: Install the libraries Chrome needs
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libnss3 \
              libasound2t64 \
              libgbm1 \
              libgtk-3-0 \
              libxss1 \
              libatk-bridge2.0-0 \
              libdrm2 \
              libxkbcommon0

      - restore_cache:
          keys:
            - gd-visual-tests-dependencies-v1-{{ checksum "newIDE/visual-tests/package.json" }}

      - run:
          name: Install the visual tests dependencies (and the Chrome to run them in)
          # The install of "Stop here if no test is related to the changes"
          # skipped the Chrome download, and npm does not re-run the postinstall
          # of an already installed Puppeteer: run it explicitly (it does
          # nothing when Chrome is already in the restored cache).
          command: |
            cd newIDE/visual-tests
            npm install --no-audit --no-fund
            node node_modules/puppeteer/install.mjs

      - save_cache:
          paths:
            - newIDE/visual-tests/node_modules
            - ~/.cache/puppeteer
          key: gd-visual-tests-dependencies-v1-{{ checksum "newIDE/visual-tests/package.json" }}

      - run:
          name: List the tests to run
          command: |
            cd newIDE/visual-tests
            if [ "<< parameters.scope >>" = "changed" ]; then
              node run.js --suite=storybook --list-names --only-changed --base-ref=origin/master > /tmp/tests.txt
            else
              node run.js --suite=storybook --list-names > /tmp/tests.txt
            fi
            echo "Tests to run:"
            cat /tmp/tests.txt

      - run:
          name: Split the tests across the parallel containers
          # Balanced using the durations recorded by `store_test_results` on the
          # previous runs (falls back to an even split the first time).
          command: |
            if [ -s /tmp/tests.txt ]; then
              circleci tests split --split-by=timings --timings-type=filename \
                < /tmp/tests.txt > /tmp/tests-for-this-container.txt
            else
              : > /tmp/tests-for-this-container.txt
            fi
            echo "Tests for this container:"
            cat /tmp/tests-for-this-container.txt

      - run:
          name: Run the visual monkey tests on Storybook
          no_output_timeout: 30m
          # The failure is reported by the last step of the job, so that the
          # results and the screenshots of a failing run are uploaded first.
          command: |
            set +e
            cd newIDE/visual-tests
            node run.js --suite=storybook \
              --tests-file=/tmp/tests-for-this-container.txt \
              --artifacts-dir=/tmp/visual-tests-artifacts \
              --junit-path=/tmp/visual-tests-results/results.xml
            echo $? > /tmp/visual-tests-exit-code

      - store_test_results:
          path: /tmp/visual-tests-results
      - store_artifacts:
          path: /tmp/visual-tests-artifacts
          destination: visual-tests

      - run:
          name: Report whether the visual monkey tests passed
          command: exit "$(cat /tmp/visual-tests-exit-code)"

  # Visual monkey tests, "editor" suite: smoke tests using a real, packaged
  # version of the app (like run-cli-html5-export-linux does) opening a real
  # example game.
  #
  # Without a local build (so on a branch), the tests run against the latest
  # portable build of `master` on S3: they then exercise the tests of the
  # branch, not its changes to the app itself - those are only tested by the
  # jobs following build-linux, on the branches building the app.
  run-visual-monkey-tests-editor-linux:
    parameters:
      scope:
        description: >
          "all" runs every test. "changed" only runs the tests related to what
          the branch changes - and nothing at all if it changes nothing related.
        type: enum
        enum: ['all', 'changed']
        default: 'all'
      use-local-build:
        description: When true, attach the workspace produced by build-linux and use its portable zip instead of downloading the latest one from S3.
        type: boolean
        default: false
    resource_class: medium
    docker:
      - image: cimg/node:24.13.0

    working_directory: ~/GDevelop

    steps:
      - checkout

      - halt-unless-a-visual-test-is-related-to-the-changes:
          scope: << parameters.scope >>
          suite: 'editor'

      - when:
          condition: << parameters.use-local-build >>
          steps:
            - attach_workspace:
                at: ~/GDevelop/build-linux-workspace

      # Runtime libraries required by Electron (headless still needs nss /
      # alsa to even start up).
      - run:
          name: Install Electron runtime dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libnss3 \
              libasound2t64 \
              libgbm1 \
              libgtk-3-0 \
              libxss1 \
              libatk-bridge2.0-0 \
              libdrm2 \
              libxkbcommon0 \
              xvfb

      - run:
          name: Install the visual tests dependencies
          command: cd newIDE/visual-tests && npm install --no-audit --no-fund

      - run:
          name: Run the visual monkey tests on the real editor
          # The editor is a GUI app: it needs a display, even to run headless.
          # The failure is reported by the last step of the job, so that the
          # results and the screenshots of a failing run are uploaded first.
          no_output_timeout: 30m
          command: |
            set +e
            cd newIDE/visual-tests
            if [ "<< parameters.use-local-build >>" = "true" ]; then
              ZIP_PATH=$(ls ~/GDevelop/build-linux-workspace/gdevelop-*.zip | grep -v -- '-arm64' | head -1)
              if [ -z "$ZIP_PATH" ]; then
                echo "No portable zip found in the build-linux workspace." >&2
                exit 1
              fi
              echo "Using the locally built portable zip: $ZIP_PATH"
              EXTRA_ARGS="--gdevelop-zip=$ZIP_PATH"
            else
              echo "No local build available; the latest portable zip of master will be downloaded."
              EXTRA_ARGS="--gdevelop-branch=master"
            fi
            if [ "<< parameters.scope >>" = "changed" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --only-changed --base-ref=origin/master"
            fi
            xvfb-run -a --server-args="-screen 0 1500x1000x24" \
              node run.js --suite=editor $EXTRA_ARGS \
              --artifacts-dir=/tmp/visual-tests-artifacts \
              --junit-path=/tmp/visual-tests-results/results.xml
            echo $? > /tmp/visual-tests-exit-code

      - store_test_results:
          path: /tmp/visual-tests-results
      - store_artifacts:
          path: /tmp/visual-tests-artifacts
          destination: visual-tests

      - run:
          name: Report whether the visual monkey tests passed
          command: exit "$(cat /tmp/visual-tests-exit-code)"

workflows:
  gdevelop_js-wasm-extra-checks:
    jobs:
      - build-gdevelop_js-debug-sanitizers-and-extra-checks:
          # Extra checks are resource intensive so don't always run them.
          filters:
            branches:
              only:
                - master
                - stable
                - /experimental-build.*/
  tests:
    jobs:
      - build-gdcore-tests-sanitizers

  builds:
    jobs:
      - build-gdevelop_js-wasm-only
      - build-macos:
          # The macOS version builds by itself GDevelop.js
          # (so we verify we can build it on macOS).
          # requires:
          #   - build-gdevelop_js-wasm-only
          filters:
            branches:
              only:
                - master
                - stable
                - /experimental-build.*/
      - build-linux:
          requires:
            - build-gdevelop_js-wasm-only
          filters:
            branches:
              only:
                - master
                - stable
                - /experimental-build.*/
      # Right after build-linux, run the CLI HTML5 export against the
      # portable zip it just produced (via the attached workspace).
      - run-cli-html5-export-linux:
          name: cli-html5-export-linux
          use-local-build: true
          requires:
            - build-linux
          filters:
            branches:
              only:
                - master
                - stable
                - /experimental-build.*/
      # Right after build-linux, run the visual monkey tests of the real
      # editor against the portable zip it just produced.
      - run-visual-monkey-tests-editor-linux:
          name: visual-monkey-tests-editor-linux
          use-local-build: true
          requires:
            - build-linux
          filters:
            branches:
              only:
                - master
                - stable
                - /experimental-build.*/
      - build-windows:
          requires:
            - build-gdevelop_js-wasm-only
          filters:
            branches:
              only:
                - master
                - stable
                - /experimental-build.*/
      # Disabled as Windows builds are now done by CircleCI.
      # - trigger-appveyor-windows-build:
      #     requires:
      #       - build-gdevelop_js-wasm-only
      #     filters:
      #       branches:
      #         only:
      #           - master
      #           - stable
      #           - /experimental-build.*/

  # Daily end-to-end tests running against the latest portable build uploaded
  # to S3 for master: the CLI HTML5 export, and the visual monkey tests
  # manipulating the editor. Runs every day at 16:00 UTC (4pm UTC).
  daily-end-to-end-tests:
    triggers:
      - schedule:
          cron: "0 16 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - run-cli-html5-export-linux
      - run-visual-monkey-tests-editor-linux

  # On `master`/`stable` (or when explicitly asked for): manipulate the editors
  # in a real browser and check that nothing is broken, with every test.
  # (`master`, `stable` and the experimental builds also run the editor suite
  # against the build build-linux just produced, in the main workflow.)
  all-visual-tests:
    when:
      or:
        - equal: [master, << pipeline.git.branch >>]
        - equal: [stable, << pipeline.git.branch >>]
        - << pipeline.parameters.run-all-visual-tests >>
    jobs:
      - build-storybook-for-visual-tests:
          name: visual-tests-storybook-build-all
          scope: 'all'
      - run-visual-monkey-tests-storybook-linux:
          name: visual-tests-storybook-all
          scope: 'all'
          parallelism: << pipeline.parameters.all-visual-tests-parallelism >>
          requires:
            - visual-tests-storybook-build-all
      # On a branch forced with `run-all-visual-tests`: every test of the
      # editor suite too, against the latest portable build of `master`.
      - run-visual-monkey-tests-editor-linux:
          name: visual-tests-editor-all
          scope: 'all'
          filters:
            branches:
              ignore:
                - master
                - stable
                - /experimental-build.*/

  # On a branch / Pull Request: only run the tests related to what it changes
  # (nothing at all when it changes nothing related to them). The editor suite
  # runs against the latest portable build of `master` (a branch builds no
  # app), so it exercises the tests of the branch, not its changes to the app.
  changed-visual-tests:
    when:
      and:
        - not:
            equal: [master, << pipeline.git.branch >>]
        - not:
            equal: [stable, << pipeline.git.branch >>]
        - not: << pipeline.parameters.run-all-visual-tests >>
    jobs:
      - build-storybook-for-visual-tests:
          name: visual-tests-storybook-build-changed
          scope: 'changed'
      - run-visual-monkey-tests-storybook-linux:
          name: visual-tests-storybook-changed
          scope: 'changed'
          parallelism: << pipeline.parameters.changed-visual-tests-parallelism >>
          requires:
            - visual-tests-storybook-build-changed
      - run-visual-monkey-tests-editor-linux:
          name: visual-tests-editor-changed
          scope: 'changed'
          filters:
            branches:
              ignore:
                - /experimental-build.*/
