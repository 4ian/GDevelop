<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .t{fill:#F3F3F7}.m{fill:#9A9AAB}.mm{fill:#6E6E80}
      .sub{font-size:11px;letter-spacing:.3px}
      .mono{font-family:'SF Mono',Menlo,monospace}
    </style>
  </defs>
  <rect width="1040" height="470" fill="#0E0E15"/>
  <text x="40" y="38" class="t" font-size="18" font-weight="700">Search — matches name, path, and value</text>
  <text x="40" y="60" class="m" font-size="12.5">Query “sp” · ancestors kept &amp; auto-expanded · matched text highlighted in the name only, never in the value.</text>

  <!-- toolbar with active search -->
  <rect x="40" y="78" width="960" height="40" rx="10" fill="#16161F" stroke="#2E2E3C" stroke-width="1"/>
  <rect x="52" y="86" width="88" height="24" rx="6" fill="#4A3AA0"/><text x="96" y="102" fill="#E7DEFF" font-size="11.5" text-anchor="middle" font-weight="600">＋ Add</text>
  <rect x="148" y="86" width="24" height="24" rx="5" fill="#22222E"/><text x="160" y="102" class="t" font-size="12" text-anchor="middle">⧉</text>
  <rect x="176" y="86" width="24" height="24" rx="5" fill="#22222E"/><text x="188" y="102" class="t" font-size="12" text-anchor="middle">🗑</text>
  <rect x="636" y="86" width="352" height="24" rx="6" fill="#26263A" stroke="#7B61FF" stroke-width="1.3"/>
  <circle cx="653" cy="98" r="5" fill="none" stroke="#9D8BFF" stroke-width="1.5"/><line x1="657" y1="102" x2="660" y2="105" stroke="#9D8BFF" stroke-width="1.5"/>
  <text x="668" y="102" class="t" font-size="12" font-weight="600">sp</text>
  <rect x="682" y="91" width="1.4" height="14" fill="#9D8BFF"/>
  <circle cx="976" cy="98" r="7" fill="#3A3A4C"/><text x="976" y="102" class="t" font-size="10" text-anchor="middle">✕</text>

  <text x="40" y="146" class="mm sub">2 matches · Esc clears &amp; restores selection · scoped to the active tab</text>

  <!-- filtered list -->
  <rect x="40" y="160" width="960" height="230" fill="#14141C" stroke="#2E2E3C" stroke-width="1"/>

  <!-- stats: ancestor kept, dimmed, expanded -->
  <text x="66" y="192" class="t" font-size="13">▾</text>
  <text x="86" y="192" class="m" font-size="13.5">stats</text>
  <rect x="552" y="180" width="30" height="20" rx="5" fill="#4A3C1E"/><text x="567" y="194" class="sub" fill="#E7C285" text-anchor="middle" font-weight="700">{}</text>
  <text x="640" y="192" class="mm mono" font-size="12">3 items</text>
  <text x="972" y="192" class="mm sub" text-anchor="end">ancestor</text>

  <!-- speed : MATCH, selected -->
  <line x1="100" y1="208" x2="100" y2="248" stroke="#33333F" stroke-width="1"/>
  <rect x="46" y="216" width="948" height="30" rx="8" fill="#7B61FF" fill-opacity="0.16"/>
  <rect x="46" y="216" width="3" height="30" rx="1.5" fill="#7B61FF"/>
  <rect x="120" y="220" width="24" height="18" rx="4" fill="#7B61FF" fill-opacity="0.4"/>
  <text x="120" y="236" class="t" font-size="13.5" font-weight="700"><tspan fill="#EDE6FF">sp</tspan><tspan fill="#F3F3F7">eed</tspan></text>
  <rect x="552" y="224" width="30" height="20" rx="5" fill="#2B3B58"/><text x="567" y="238" class="sub" fill="#9DC0F0" text-anchor="middle" font-weight="700">#</text>
  <rect x="640" y="223" width="300" height="22" rx="6" fill="#26263A"/><text x="652" y="238" class="t mono" font-size="12">400</text>

  <!-- keySpawn : MATCH in name -->
  <text x="66" y="284" class="mm" font-size="13">⋮⋮</text>
  <text x="86" y="284" class="t" font-size="13.5"><tspan fill="#F3F3F7">key</tspan><tspan fill="#EDE6FF" font-weight="700">Sp</tspan><tspan fill="#F3F3F7">awn</tspan></text>
  <rect x="552" y="272" width="30" height="20" rx="5" fill="#2B3B58"/><text x="567" y="286" class="sub" fill="#9DC0F0" text-anchor="middle" font-weight="700">#</text>
  <rect x="640" y="271" width="300" height="22" rx="6" fill="#26263A"/><text x="652" y="286" class="t mono" font-size="12">3</text>

  <text x="66" y="322" class="mm sub">Non-matching siblings (score, hp, tags…) hidden; order preserved.</text>
  <text x="66" y="346" class="mm sub">Matched value editable inline — a search can jump straight to a deep field and edit it in place.</text>
  <text x="66" y="370" class="mm sub">Highlight is on the name/path text only, never on the editable value.</text>

  <text x="40" y="424" class="mm sub">One list, filtered (scope column omitted here for focus). No master-detail, no value pane — same rows, fewer of them.</text>
</svg>
